<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/beta.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rofiant</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Dark (default) — matches .dark's --background in index.css */
        background: #141414;
        z-index: 9999;
        transition: opacity 0.15s ease-out;
      }
      #splash.light { background: #faf9f8; }
      #splash svg { animation: splash-spin 0.8s linear infinite; transform-origin: center; }
      #splash circle { stroke: #f5f5f4; }
      #splash.light circle { stroke: #2c2826; }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function () {
        // Sync read so the splash matches the user's theme before first paint
        // instead of flashing the wrong background.
        try {
          var raw = localStorage.getItem("rofiant_settings");
          var theme = raw ? JSON.parse(raw).theme : "dark";
          if (theme === "dark-classic") theme = "dark";
          if (theme === "system") {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          window.__rofiantTheme = theme;
        } catch (e) {
          window.__rofiantTheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <!--
      Present before React mounts so tauri-plugin-decorum's Windows overlay-
      titlebar script (which checks for this marker at DOMContentLoaded, only
      once, with no fallback) never races the app's own render and injects
      its own invisible full-width drag-region overlay on top of our real
      titlebar. The actual titlebar in src/components/TitleBar.tsx carries
      the same attribute once mounted; this one is a hidden placeholder that
      only needs to exist for the plugin's single early check to find.
    -->
    <div data-tauri-decorum-tb style="display: none"></div>
    <div id="root"></div>
    <div id="splash">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="11" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="52 17" opacity="0.9" />
      </svg>
    </div>
    <script>
      document.getElementById("splash").classList.add(window.__rofiantTheme);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
